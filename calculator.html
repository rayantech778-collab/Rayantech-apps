<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RayanTech Calculator</title>
<style>
body{background:#0a0a0a;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;font-family:Arial}
.calc{background:#1a1a1a;padding:20px;border-radius:20px;width:300px;box-shadow:0 10px 30px #000}
#display{width:100%;height:70px;background:#000;color:#00ffcc;font-size:36px;text-align:right;border:none;border-radius:10px;padding:10px;margin-bottom:15px;box-sizing:border-box}
.btns{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
button{height:60px;font-size:22px;border:none;border-radius:15px;background:#2a2a2a;color:#fff}
button.op{background:#ff9500}
button.eq{background:#00ffcc;color:#000;font-weight:bold}
button.clr{background:#ff3b30}
button:active{transform:scale(0.95)}
h3{text-align:center;color:#555;margin:0 0 10px;font-size:12px;letter-spacing:3px}
</style>
</head>
<body>
<div class="calc">
<h3>RAYANTECH</h3>
<input type="text" id="display" disabled placeholder="0">
<div class="btns">
<button class="clr" onclick="clr()">C</button>
<button onclick="del()">⌫</button>
<button onclick="add('%')">%</button>
<button class="op" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="op" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="op" onclick="add('-')">-</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="op" onclick="add('+')">+</button>

<button onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button onclick="add('00')">00</button>
<button class="eq" onclick="calc()">=</button>
</div>
</div>

<script>
let d=document.getElementById('display');
function add(v){ d.value+=v }
function clr(){ d.value='' }
function del(){ d.value=d.value.slice(0,-1) }
function calc(){
  try{
    d.value=eval(d.value);
  }catch{
    d.value='Error';
  }
}
</script>
</body>
</html>
